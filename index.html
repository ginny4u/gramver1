<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>국어 높임 표현 점검 OX 퀴즈</title>
    <style>
        :root {
            --primary: #007bff;
            --primary-dark: #0056b3;
            --danger: #ff4d4f;
            --danger-dark: #d9363e;
            --bg-color: #f0f4f8;
            --text-color: #333;
            --card-bg: #ffffff;
        }
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        #app {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 90, 180, 0.1);
            padding: 40px 30px;
            box-sizing: border-box;
            margin: 20px;
        }
        h1, h2 {
            color: var(--primary-dark);
            text-align: center;
            word-break: keep-all;
            margin-top: 0;
        }
        .hidden {
            display: none !important;
        }
        .btn {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 15px;
            font-weight: bold;
        }
        .btn:hover {
            background: var(--primary-dark);
        }
        .btn-outline {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
        }
        .btn-outline:hover {
            background: var(--primary);
            color: white;
        }
        .ox-container {
            display: flex;
            gap: 20px;
            margin-top: 40px;
        }
        .btn-ox {
            flex: 1;
            padding: 50px 0;
            font-size: 4rem;
            font-weight: bold;
            border-radius: 16px;
            border: none;
            cursor: pointer;
            color: white;
            transition: transform 0.1s, box-shadow 0.3s;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
        }
        .btn-o { background: var(--primary); }
        .btn-o:active { transform: scale(0.95); box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .btn-x { background: var(--danger); }
        .btn-x:active { transform: scale(0.95); box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        
        .progress {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
            font-size: 1rem;
            font-weight: bold;
            background: #eef2f7;
            padding: 8px;
            border-radius: 8px;
            display: inline-block;
            width: 100%;
            box-sizing: border-box;
        }
        .question-text {
            font-size: 1.4rem;
            line-height: 1.6;
            text-align: center;
            margin-bottom: 30px;
            min-height: 100px;
            word-break: keep-all;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .score-text {
            font-size: 4rem;
            text-align: center;
            color: var(--primary);
            font-weight: bold;
            margin: 30px 0;
        }
        .review-list {
            max-height: 60vh;
            overflow-y: auto;
            padding-right: 10px;
            margin-bottom: 20px;
        }
        .review-list::-webkit-scrollbar {
            width: 8px;
        }
        .review-list::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 4px;
        }
        .review-item {
            background: #f8fafc;
            border-left: 5px solid var(--danger);
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        .review-item.correct {
            border-left-color: var(--primary);
        }
        .review-q {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 12px;
            line-height: 1.5;
            color: #1e293b;
        }
        .review-a {
            font-size: 0.95rem;
            margin-bottom: 12px;
            color: #475569;
        }
        .review-e {
            font-size: 0.95rem;
            background: #e2e8f0;
            padding: 12px;
            border-radius: 6px;
            color: #334155;
            line-height: 1.5;
        }
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: bold;
            color: white;
            margin-right: 8px;
        }
        .badge-correct { background: var(--primary); }
        .badge-wrong { background: var(--danger); }
        .desc { text-align: center; color: #666; margin-bottom: 30px; line-height: 1.5; }
        
        @media (max-width: 480px) {
            #app { padding: 30px 20px; margin: 10px; }
            .btn-ox { padding: 40px 0; font-size: 3rem; }
            .question-text { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

<div id="app">
    <!-- 시작 화면 -->
    <div id="start-screen">
        <h1>국어 높임 표현 점검<br>OX 퀴즈</h1>
        <p class="desc">제공된 문항 중 랜덤으로 10문제가 출제됩니다.<br>모든 문제를 풀고 난 후 오답노트를 확인할 수 있습니다.</p>
        <button class="btn" onclick="startQuiz()">퀴즈 시작하기</button>
    </div>

    <!-- 퀴즈 화면 -->
    <div id="quiz-screen" class="hidden">
        <div class="progress" id="progress">문제 1 / 10</div>
        <div class="question-text" id="question-text">질문이 여기에 표시됩니다.</div>
        <div class="ox-container">
            <button class="btn-ox btn-o" onclick="selectAnswer('O')">O</button>
            <button class="btn-ox btn-x" onclick="selectAnswer('X')">X</button>
        </div>
    </div>

    <!-- 결과 화면 -->
    <div id="result-screen" class="hidden">
        <h2>퀴즈 완료!</h2>
        <div class="score-text" id="score-text">0 / 10</div>
        <button class="btn" onclick="showReview()">오답노트 확인하기</button>
        <button class="btn btn-outline" onclick="startQuiz()">다시 풀기</button>
    </div>

    <!-- 오답노트 화면 -->
    <div id="review-screen" class="hidden">
        <h2>오답노트 & 해설</h2>
        <div class="review-list" id="review-container">
            <!-- 리뷰 아이템 동적 생성 -->
        </div>
        <button class="btn" onclick="startQuiz()">새로운 문제로 다시 풀기</button>
    </div>
</div>

<script>
    const allQuestions = [{"question": "높임법은 화자가 어떤 대상을 높여 말하는 법칙만을 의미하며, 화자를 낮추어 말하는 것은 포함되지 않는다.\n     \n*", "answer": "X", "explanation": "낮춤말은 화자나 화자와 관련된 대상을 낮춤으로써 상대방을 높이는 효과를 지니므로 높임 표현의 범주에 포함됩니다."}, {"question": "주체 높임법은 문장의 목적어나 부사어가 가리키는 인물을 높이는 방법이다.\n     \n*", "answer": "X", "explanation": "주체 높임법은 서술어의 주체, 즉 문장의 주어를 높이는 방법입니다."}, {"question": "객체 높임법은 서술어의 객체, 즉 문장의 목적어나 부사어가 지시하는 대상을 높이는 방법이다.\n     \n*", "answer": "O", "explanation": "객체 높임법은 문장에서 목적어나 부사어가 나타내는 대상인 객체를 높이는 방법이 맞습니다."}, {"question": "상대 높임법은 화자가 청자에 대하여 높이거나 낮추어 말하는 방법이다.\n     \n*", "answer": "O", "explanation": "상대 높임법은 말을 듣는 상대인 청자를 높이거나 낮추어 말하는 방법입니다."}, {"question": "주체 높임법을 실현하는 방법에는 선어말 어미 '-(으)시-', 주격 조사 '께서', 특수 어휘 등이 사용된다.\n     \n*", "answer": "O", "explanation": "주체 높임법은 주격 조사 '께서', 선어말 어미 '-(으)시-', 그리고 '계시다', '잡수시다' 같은 특수 어휘를 통해 실현됩니다."}, {"question": "\"할아버지께서 신문을 보신다.\"에서 주체 높임이 실현된 요소는 주격 조사 '께서' 하나뿐이다.\n     \n*", "answer": "X", "explanation": "주격 조사 '께서'뿐만 아니라 서술어 '보신다'에 결합한 주체 높임 선어말 어미 '-시-'를 통해서도 주체 높임이 실현되었습니다."}, {"question": "'계시다', '잡수시다', '주무시다'는 주체를 높이기 위해 사용하는 대표적인 특수 어휘이다.\n     \n*", "answer": "O", "explanation": "이 어휘들은 서술어의 주체(주어)가 높임의 대상일 때 사용하는 주체 높임의 특수 어휘입니다."}, {"question": "주체 높임법에서는 높임의 대상이 되는 사람이 아니라 사물에 대해서도 서술어에 '시'를 붙여 간접적으로 높일 수 있다.\n     \n*", "answer": "O", "explanation": "높여야 할 대상의 신체, 소유물, 생각 등과 관련된 말에 '-(으)시-'를 결합하여 높이는 방법을 간접 높임이라고 합니다."}, {"question": "\"선생님 말씀이 계시겠습니다.\"는 선생님의 말씀을 높이는 올바른 간접 높임 표현이다.\n     \n*", "answer": "X", "explanation": "간접 높임 표현에서는 '계시다'라는 특수 어휘를 사용할 수 없으며, '있으시다'를 사용하는 것이 원칙입니다."}, {"question": "간접 높임은 주로 서술절을 안은 문장에서 나타난다.\n     \n*", "answer": "O", "explanation": "\"할머니께서 귀가 밝으십니다\"처럼 주체 높임의 간접 높임은 주로 서술절을 가진 안은문장의 형태로 나타납니다."}, {"question": "\"할머니께서 귀가 밝으십니다.\"에서 '밝으십니다'의 서술어 주체는 '귀'이지만, 문장 전체의 주어가 '할머니'이므로 '-시-'를 붙여 할머니를 간접적으로 높인 것이다.\n     \n*", "answer": "O", "explanation": "'밝다'의 직접적인 주체는 '귀'이지만 높임의 대상인 할머니의 신체 부위이므로 '-시-'를 결합하여 간접 높임을 실현한 올바른 문장입니다."}, {"question": "\"화장실은 2층에 있으십니다.\"처럼 사물을 대상으로 주체 높임 선어말 어미 '-(으)시-'를 사용하는 것은 올바른 표현이다.\n     \n*", "answer": "X", "explanation": "주체 높임 선어말 어미 '-(으)시-'는 사람을 높일 때만 사용하므로, 사물인 화장실을 높인 이 문장은 높임 표현을 과도하게 남용한 오용 사례입니다."}, {"question": "\"선생님 말씀이 있으시겠습니다.\"가 원칙적인 표현이지만, \"선생님 말씀이 있겠습니다.\"도 허용된다.\n     \n*", "answer": "O", "explanation": "간접 높임에서 '있으시다'가 원칙적인 표현이지만 '있다'에 '-시-'를 넣지 않은 '있겠습니다' 역시 허용되는 표현입니다."}, {"question": "'계시다'는 직접 높임 표현과 간접 높임 표현 모두에서 자유롭게 사용할 수 있다.\n     \n*", "answer": "X", "explanation": "'계시다'는 직접 높임 표현에서만 쓸 수 있으며, 간접 높임 표현에는 사용할 수 없습니다."}, {"question": "'편찮으시다'는 '마음이 거북하거나 괴롭다'라는 뜻의 높임말이거나, '-(으)시-'와 함께 쓰여 병을 앓고 있다는 뜻을 나타내는 '아프다'의 높임말이다.\n     \n*", "answer": "O", "explanation": "'편찮으시다'는 주체인 인물이 병을 앓고 있을 때 '아프다' 대신 사용하는 높임의 형용사입니다."}, {"question": "'진지', '말씀', '성함', '약주'는 높여야 할 인물과 관련된 대상을 높이는 간접 높임말(명사)이다.\n     \n*", "answer": "O", "explanation": "이 명사들은 주체를 직접 높이는 말이 아니라, 높여야 할 인물과 관련된 밥, 말, 이름, 술 등을 높여 부르는 간접 높임 명사입니다."}, {"question": "'말씀'은 유일하게 상대방을 높이는 높임말과 자신을 낮추는 낮춤말에 모두 통용되는 어휘이다.\n     \n*", "answer": "O", "explanation": "'말씀'은 선생님의 말씀(높임말)처럼 쓰일 수도 있고, 제가 드릴 말씀(낮춤말)처럼 쓰일 수도 있어 양쪽에 모두 통용됩니다."}, {"question": "\"선생님 말씀을 명심하겠습니다.\"에서 '말씀'은 화자 자신의 말을 낮추는 간접 낮춤말이다.\n     \n*", "answer": "X", "explanation": "이 문장에서 '말씀'은 높임의 대상인 선생님의 말을 가리키므로 간접 높임말에 해당합니다."}, {"question": "\"선생님께 드리고 싶은 말씀이 있는데요.\"에서 '말씀'은 화자 자신의 말을 낮추는 간접 낮춤말이다.\n     \n*", "answer": "O", "explanation": "여기에서의 '말씀'은 화자 자신이 선생님께 드리는 말을 가리키므로 자기를 낮추는 간접 낮춤말이 맞습니다."}, {"question": "'께'는 객체 높임에 쓰이는 부사격 조사이고, '께서'는 주체 높임에 쓰이는 주격 조사이다.\n     \n*", "answer": "O", "explanation": "'께'는 부사어 자리에 오는 객체를 높이고, '께서'는 주어 자리에 오는 주체를 높입니다."}, {"question": "객체 높임법은 주로 부사격 조사 '께'나 '드리다', '모시다', '여쭈다', '뵈다' 등의 특수 어휘를 사용하여 실현된다.\n     \n*", "answer": "O", "explanation": "객체 높임법은 서술어의 목적어나 부사어가 지시하는 대상을 높이기 위해 조사 '께'나 특수 어휘 용언들을 사용합니다."}, {"question": "\"나는 할머니를 모시고 병원으로 갔다.\"에서 '모시고'는 문장의 부사어를 높이기 위해 사용된 특수 어휘이다.\n     \n*", "answer": "X", "explanation": "'할머니를'은 문장의 목적어이므로, '모시고'는 부사어가 아니라 목적어가 지시하는 객체를 높이기 위해 사용된 것입니다."}, {"question": "특수 어휘 '드리다'는 부사어를 높일 때 사용하고, '모시다'는 목적어를 높일 때 사용한다.\n     \n*", "answer": "O", "explanation": "'~에게/께 드리다'는 부사어를 높이고, '~을/를 모시다'는 목적어를 높이는 데 쓰입니다."}, {"question": "\"민아가 선생님께 초콜릿을 드렸다.\"에서 객체 높임이 실현된 요소는 부사격 조사 '께'와 특수 어휘 '드렸다'이다.\n     \n*", "answer": "O", "explanation": "부사어인 '선생님'을 높이기 위해 부사격 조사 '께'와 '주다'의 높임인 특수 어휘 '드리다'를 함께 사용하였습니다."}, {"question": "국어에서 조사는 생략이 불가능하므로, 문장에서 높임의 주격 조사 '께서'는 생략할 수 없다.\n     \n*", "answer": "X", "explanation": "우리말에서 조사는 생략이 가능하므로 \"어머니 저녁 드시러 나가셨습니다\"처럼 '께서'를 생략해도 높임 선어말 어미 등을 통해 높임이 실현될 수 있습니다."}, {"question": "상대 높임법은 크게 격식체와 비격식체로 나눌 수 있으며, 주로 문장의 종결 어미를 통해 실현된다.\n     \n*", "answer": "O", "explanation": "상대 높임법은 화자가 청자를 높이거나 낮추는 방법으로, 격식체와 비격식체 체계가 있으며 종결 어미에 의해 결정됩니다."}, {"question": "격식체는 상대방과 심리적 거리감을 줄이고 친근감을 나타내기 위해 주로 사용하는 표현이다.\n     \n*", "answer": "X", "explanation": "격식체는 격식을 차려 심리적인 거리감을 나타내는 표현이며, 친근감이나 정감을 나타내는 것은 비격식체입니다."}, {"question": "상대 높임법의 격식체 등급에는 하십시오체, 하오체, 하게체, 해라체가 포함된다.\n     \n*", "answer": "O", "explanation": "상대 높임법의 격식체는 아주높임(하십시오체), 예사높임(하오체), 예사낮춤(하게체), 아주낮춤(해라체)의 4개 등급으로 나뉩니다."}, {"question": "비격식체인 해요체와 해체는 주로 보조사 '요'의 유무에 의해 실현되고 구분된다.\n     \n*", "answer": "O", "explanation": "해요체는 해체에 보조사 '요'가 붙어 상대를 높이는 비격식체 표현입니다."}, {"question": "\"존댓말(높임말)은 격식체이고, 반말은 비격식체이다.\"라는 인식은 옳은 인식에 해당한다.\n     \n*", "answer": "X", "explanation": "격식체와 비격식체의 구분은 존댓말과 반말의 구분이 아니라 표현의 '격식 여부'를 의미합니다. 아주낮춤인 해라체(\"밥 먹어라\")는 낮춤말이지만 격식체에 속합니다."}, {"question": "\"동생아, 이리 와서 밥 먹어라.\"에서 '먹어라'는 해라체로, 격식체에 해당한다.\n     \n*", "answer": "O", "explanation": "'해라체'는 청자를 아주 낮추는 등급이지만 엄연히 격식을 갖춘 '격식체'에 해당합니다."}, {"question": "문장의 종결 표현(평서형, 의문형 등)과 상대 높임법은 모두 종결 어미에 의해 실현되는 문법 요소이다.\n     \n*", "answer": "O", "explanation": "문장의 종류를 결정하는 종결 표현과 상대 높임법은 종결 어미를 통해 한꺼번에 실현되고 결정됩니다."}, {"question": "\"궁금하면 제게 여쭈어 보세요.\"라는 표현은 화자인 '저' 자신을 높이고 있으므로 잘못된 높임 표현이다.\n     \n*", "answer": "X", "explanation": "'여쭈다'는 객체(상대방인 윗사람)를 높일 때 쓰는 말인데, 이 문장에서는 \"제게 여쭈어\"라 하여 화자 자신에게 '여쭈다'를 쓰고 있으므로 잘못된 오용 사례입니다."}, {"question": "\"부모님께서 할머니를 모시고 여행을 가자고 말씀을 하셨습니다.\"에서 '말씀'은 서술의 객체인 '할머니'를 높이는 특수 어휘이다.\n     \n*", "answer": "X", "explanation": "여기서의 '말씀'은 주체인 '부모님'이 하신 행동이므로, 객체가 아니라 서술의 주체인 부모님을 높이는 데 쓰이고 있습니다."}, {"question": "\"제가 뭐라 드릴 말씀이 없습니다.\"에서 '제'와 '말씀'은 화자 자신과 관련된 것을 낮춤으로써 상대방을 높이는 겸양의 표현이다.\n     \n*", "answer": "O", "explanation": "자신을 낮추는 '저(제)'와 자신의 말을 낮추는 '말씀'을 사용하여 청자인 상대방을 높여주는 올바른 겸양 표현입니다."}, {"question": "\"철수야, 할아버지 오셨어.\"라는 문장은 [주체 높임 +], [상대 높임 -]로 표시할 수 있다.\n     \n*", "answer": "O", "explanation": "주어인 할아버지를 높이고 있으므로 주체 높임은 [+], 청자인 철수는 낮추고 있으므로 상대 높임은 [-]가 됩니다."}, {"question": "\"영희야, 아버지께서는 할머니를 모시고 먼저 나가셨어.\"에서 상대 높임법은 청자인 영희를 높이고 있다.\n     \n*", "answer": "X", "explanation": "종결 어미 '-어'(해체)를 사용하여 청자인 영희를 낮추고 있으므로 상대 높임은 비존대[-]입니다."}, {"question": "\"영희야, 선생님께서 찾으셔.\"는 청자는 낮추고 주체는 높여서 표현한 문장이다.\n     \n*", "answer": "O", "explanation": "청자인 영희는 낮추고, 문장의 주체인 선생님은 주격 조사 '께서'와 선어말 어미 '-시-'로 높이고 있습니다."}, {"question": "아주 높임 표현인 \"여기에 앉으십시오\"는 명령형 어미를 사용하여 청자에게 행동을 강요하는 암묵적 강제성을 띠므로 항상 가장 공손한 표현이라 하기는 어렵다.\n     \n*", "answer": "O", "explanation": "하십시오체 명령형은 격식은 높지만 강제성을 띨 수 있어, \"앉으시겠어요?\"와 같이 질문 형식으로 선택권을 주는 간접 화법이 더 공손한 표현이 될 수 있습니다."}, {"question": "상대 높임 등급 중 '하게체'는 예사 높임에 해당하며 주로 장인과 장모가 사위에게 말할 때 사용된다.\n     \n*", "answer": "X", "explanation": "'하게체'는 예사 높임이 아니라 '예사 낮춤'에 해당하는 등급입니다."}, {"question": "높임 표현은 문법적 규칙을 지키는 역할만 할 뿐, 화자의 주관적인 존경 의도나 불만 등의 감정을 전달하는 도구로는 활용될 수 없다.\n     \n*", "answer": "X", "explanation": "높임 표현을 통해 주체에 대한 존경을 담거나, 친구 사이에 갑자기 해요체(\"그러세요?\")를 사용하여 불만이나 거리감을 표출하는 등 화자의 감정과 의도를 전달할 수 있습니다."}, {"question": "\"저희가 어머니께 드렸던 선물이 여기 있네요.\"에서 '저희'는 그 자체에 낮춤의 의미가 있는 특수 어휘이며, '드리다'는 높임의 의미가 담긴 특수 어휘이다.\n     \n*", "answer": "O", "explanation": "'저희'는 자신을 낮추는 겸양의 특수 어휘이고, '드리다'는 객체를 높이는 특수 어휘가 맞습니다."}, {"question": "\"선생님, 어제 부모님께서 할머니를 모시고 여행을 가자고 말씀을 하셨습니다.\"에서 청자인 '선생님'을 높이기 위해 사용된 요소는 종결 어미 '-습니다'이다.\n     \n*", "answer": "O", "explanation": "하십시오체 종결 어미 '-습니다'를 사용하여 대화 상대인 청자(선생님)를 높여 상대 높임법을 실현하고 있습니다."}, {"question": "주체 직접 높임말인 '자다'의 높임 표현은 '주무시다', '먹다'의 직접 높임 표현은 '잡수시다' 또는 '드시다'이다.\n     \n*", "answer": "O", "explanation": "주체를 직접 높일 때 사용하는 특수 어휘로 '주무시다', '잡수시다', '드시다'가 바르게 짝지어졌습니다."}, {"question": "주체 높임법은 문장의 서술어를 행하는 주체(주어)를 높이는 방법이다.", "answer": "O", "explanation": "주체 높임법은 서술어의 행위를 하거나 그 상태에 있는 문장의 주어 자리에 오는 대상을 높이는 방법이 맞습니다."}, {"question": "객체 높임법은 문장에서 서술어의 행위가 미치는 대상인 목적어나 부사어를 높이는 방법이다.", "answer": "O", "explanation": "객체 높임법은 문장의 목적어나 부사어가 지시하는 대상(객체)을 높이는 방법입니다."}, {"question": "상대 높임법은 대화의 주체가 되는 사람을 높이는 방법으로, 청자의 높고 낮음과는 관계가 없다.", "answer": "X", "explanation": "상대 높임법은 화자가 말을 듣는 상대, 즉 '청자'를 높이거나 낮추어 말하는 방법입니다."}, {"question": "주체 높임 선어말 어미 '-(으)시-'는 높여야 할 인물뿐만 아니라, 그 인물이 아끼는 애완동물이나 식물을 직접 높일 때도 사용할 수 있다.", "answer": "X", "explanation": "주체 높임 선어말 어미 '-(으)시-'는 오직 사람을 높일 때만 사용하는 것이 원칙입니다."}, {"question": "\"아버지께서 지금 신문을 보신다.\"에서 주체 높임을 실현하는 요소는 주격 조사 '께서'와 선어말 어미 '-시-'이다.", "answer": "O", "explanation": "주격 조사 '께서'와 서술어 '보신다'에 포함된 선어말 어미 '-시-'를 통해 문장의 주어인 아버지를 높이고 있습니다."}, {"question": "부사격 조사 '께'는 문장의 주어를 높이기 위해 사용하는 주격 조사이다.", "answer": "X", "explanation": "'께'는 부사어를 높일 때 사용하는 부사격 조사이며, 주어를 높이는 주격 조사는 '께서'입니다."}, {"question": "\"형님이 밤에 집에 계신다.\"에서 '계시다'는 주체인 형님을 직접적으로 높이는 특수 어휘이다.", "answer": "O", "explanation": "'계시다'는 '있다'의 주체 높임 특수 어휘로, 주체를 직접적으로 높일 때 사용합니다."}, {"question": "\"선생님, 질문이 있으십니다.\"에서 '있으시다'는 주체인 '질문'을 통해 선생님을 간접적으로 높이는 올바른 표현이다.", "answer": "X", "explanation": "질문이 있는 것은 화자 본인이므로, 주체 높임 선어말 어미를 통해 선생님이 아닌 화자를 직접 높인 잘못된 표현이다."}, {"question": "\"선생님 말씀이 계시겠습니다.\"는 주체인 선생님의 말씀을 직접 높이기 위해 '계시다'를 사용한 올바른 문장이다.", "answer": "X", "explanation": "특수 어휘 '계시다'는 직접 높임에만 쓸 수 있으므로, 간접 높임의 대상인 '말씀'에는 '있으시겠습니다'를 써야 합니다."}, {"question": "\"주문하신 아메리카노 나오셨습니다.\"는 손님을 간접적으로 정중하게 높인 올바른 생활 속 높임 표현이다.", "answer": "X", "explanation": "사람이 아닌 사물인 '아메리카노'에 선어말 어미 '-시-'를 붙여 과도하게 높인 잘못된 오용 표현입니다."}, {"question": "\"손님, 찾으시는 사이즈가 지금 없으십니다.\"라는 표현은 사물을 불필요하게 높인 남용 사례이므로 \"없습니다\"로 수정해야 한다.", "answer": "O", "explanation": "'사이즈'는 높임 선어말 어미 '-(으)시-'를 사용할 대상이 아니므로 \"없습니다\"가 올바른 표현입니다."}, {"question": "\"이 상품은 품절이십니다.\"처럼 매장에서 사물의 상태를 설명할 때 '-(으)시-'를 사용하는 것은 국어 언어 예절상 권장되는 간접 높임이다.", "answer": "X", "explanation": "사물이나 사물의 상태를 과도하게 높이는 것은 선어말 어미 '-(으)시-'의 대표적인 오남용 사례에 해당합니다."}, {"question": "객체 높임 특수 어휘 중 '드리다'는 목적어를 높일 때 사용하고, '모시다'는 부사어를 높일 때 사용한다.", "answer": "X", "explanation": "'드리다'는 부사어(~에게/께)가 지시하는 대상을 높이고, '모시다'는 목적어(~을/를)가 지시하는 대상을 높일 때 사용합니다."}, {"question": "\"나는 할머니를 모시고 병원으로 갔다.\"에서 객체 높임이 실현된 이유는 목적어인 '할머니'가 높임의 대상이기 때문이다.", "answer": "O", "explanation": "목적어 '할머니'를 높이기 위해 특수 어휘 '모시다'를 사용한 올바른 객체 높임법 문장입니다."}, {"question": "\"수지가 선생님께 초콜릿을 주었다.\"를 객체 높임법에 맞게 바꾸면 \"수지가 선생님께 초콜릿을 드렸다.\"가 된다.", "answer": "O", "explanation": "부사어 지시 대상인 '선생님'을 높이기 위해 부사격 조사 '께'와 특수 어휘 '드리다'를 사용한 올바른 문장입니다."}, {"question": "'여쭈다'는 문장의 주어가 서술어의 행위를 하는 상대방(부사어)보다 높을 때만 제한적으로 사용하는 주체 높임 어휘이다.", "answer": "X", "explanation": "'여쭈다'는 부사어가 가리키는 대상, 즉 서술어의 객체를 높이기 위해 사용하는 객체 높임 특수 어휘입니다."}, {"question": "\"궁금한 점이 있으면 언제든 제게 여쭈어 보세요.\"라는 표현은 화자인 '저'를 높이고 있으므로 잘못된 높임 표현이다.", "answer": "O", "explanation": "'여쭈다'는 윗사람에게 묻는 객체 높임말이므로, 화자 자신에게 사용하면 자기를 높이게 되어 잘못된 오용입니다."}, {"question": "\"선생님, 제가 드릴 말씀이 있습니다.\"에서 '말씀'은 화자 자신의 말을 낮추어 청자인 선생님을 높이는 간접 낮춤말이다.", "answer": "O", "explanation": "'말씀'은 자기의 말을 낮추어 상대방을 상대적으로 높이는 겸양(간접 낮춤말)의 표현으로 사용될 수 있습니다."}, {"question": "\"선생님 말씀을 명심하겠습니다.\"에서 '말씀'은 높임의 대상인 선생님의 말을 가리키므로 간접 높임말에 해당한다.", "answer": "O", "explanation": "높여야 할 인물의 말을 높여 부르는 간접 높임말로 적절하게 사용되었습니다."}, {"question": "'말씀'은 국어의 높임 표현 중에서 유일하게 높임말과 낮춤말에 모두 통용되는 어휘이다.", "answer": "O", "explanation": "'말씀'은 타인의 말을 높이는 높임말로도, 자신의 말을 낮추는 낮춤말로도 상황에 따라 모두 사용되는 독특한 단어입니다."}, {"question": "대화 상황에서 자신을 '나' 대신 '저'로, '우리' 대신 '저희'로 낮추어 표현하는 것도 넓은 의미의 높임 표현으로 볼 수 있다.", "answer": "O", "explanation": "화자 자신이나 화자와 관련된 대상을 낮춤으로써 주체나 청자를 상대적으로 높여주기 때문에 높임 표현에 포함됩니다."}, {"question": "'진지'는 윗사람을 직접 높이는 명사이며, '성함'은 윗사람과 관련된 대상을 높이는 명사이다.", "answer": "X", "explanation": "'진지(밥)'와 '성함(이름)'은 둘 다 높여야 할 인물과 직접 관련된 사물이나 개념을 높여 부르는 간접 높임 명사입니다."}, {"question": "\"할머니께서는 여전히 시력이 좋으시다.\"에서 '좋으시다'의 직접적인 서술의 주체는 '할머니'이다.", "answer": "X", "explanation": "'좋다'의 직접적인 주체는 '시력'이지만, 이것이 높임의 대상인 할머니의 신체 부위이므로 '-시-'를 붙여 간접적으로 높인 것입니다."}, {"question": "\"할머니께서 발이 편찮으시다.\"라는 문장은 할머니의 신체 부위와 관련된 서술이므로 올바른 높임 표현이다.", "answer": "X", "explanation": "'편찮으시다'는 특수어휘이므로 간접높임에서는 사용할 수 없다. 해당 문장은 간접 높임을 사용하면 \"할머니께서 발이 아프시다.\"가 된다."}, {"question": "상대 높임법의 격식체는 대화 상대와 상황에 맞게 격식을 차려 심리적인 거리감을 나타낼 때 주로 사용된다.", "answer": "O", "explanation": "격식체는 의례적이고 공식적인 상황에서 격식을 차려 일정한 심리적 거리감을 드러내는 표현입니다."}, {"question": "비격식체는 격식을 덜 차려 청자에게 친근감이나 정감을 나타내고자 할 때 사용하는 상대 높임법이다.", "answer": "O", "explanation": "비격식체는 일상적인 대화나 사적인 관계에서 분위기를 부드럽게 하거나 친밀함을 드러낼 때 주로 쓰입니다."}, {"question": "상대 높임법의 등급 중 '하십시오체'는 아주 높임, '하오체'는 예사 높임에 해당하며 둘 다 격식체이다.", "answer": "O", "explanation": "하십시오체(아주 높임)와 하오체(예사 높임)는 격식체 체계에 속하는 대표적인 높임 등급입니다."}, {"question": "상대 높임법의 등급 중 '하게체'는 청자를 아주 낮추어 대할 때 사용하는 격식체이다.", "answer": "X", "explanation": "'하게체'는 청자를 예사로 낮출 때(예사 낮춤) 사용하는 격식체 등급입니다."}, {"question": "'해라체'는 청자를 아주 낮추는 등급이므로 격식체가 아닌 비격식체(반말)에 해당한다.", "answer": "X", "explanation": "해라체는 아주 낮춤에 해당하여 존칭을 쓰지는 않지만, 문장의 종결 어미 구조상 엄연히 '격식체'에 포함됩니다."}, {"question": "\"동생아, 얼른 이리 오너라.\"나 \"철수야, 밥 먹어라.\"에 쓰인 종결 표현은 격식체인 '해라체'이다.", "answer": "O", "explanation": "'-어라/거라/너라' 등이 결합한 명령형 문장은 청자를 아주 낮추는 격식체인 '해라체'가 맞습니다."}, {"question": "비격식체인 '해요체'와 '해체'를 구분하는 가장 명확한 문법적 기준은 보조사 '요'의 유무이다.", "answer": "O", "explanation": "비격식체는 두루 높임인 '해요체'에서 문장 끝의 보조사 '요'를 탈락시키면 두루 낮춤인 '해체(반말)'가 되는 특성을 지닙니다."}, {"question": "\"선생님, 질문 있어요.\"라는 문장은 상대를 높이는 표현이지만 격식체가 아닌 비격식체인 '해요체'가 쓰였다.", "answer": "O", "explanation": "끝에 보조사 '요'가 붙어 청자에게 친근감을 주면서 상대를 높이는 비격식체 '해요체' 문장입니다."}, {"question": "국어의 상대 높임법은 문장의 종류를 결정하는 종결 어미와는 구별되는 형태로 실현된다.", "answer": "X", "explanation": "상대 높임법은 문장의 종류를 나타내는 종결 표현과 마찬가지로 문장의 '종결 어미'에 의해 동시에 결정되고 실현됩니다."}, {"question": "\"공원에서 산책하시던 할아버지가 활짝 웃으셨다.\"라는 겹문장의 안긴문장 속에는 주체 높임 표현이 실현되어 있다.", "answer": "O", "explanation": "관형절로 안긴문장인 '공원에서 산책하시던'의 서술 주체인 할아버지를 높이기 위해 선어말 어미 '-시-'가 올바르게 사용되었습니다."}, {"question": "\"형은 동생이 찾아뵈려던 선생님을 학교에서 만났습니다.\"에서 안긴문장의 객체 높임 대상은 전체 문장의 주어로 실현되었다.", "answer": "X", "explanation": "안긴문장의 객체 높임 대상인 '선생님'은 전체 안은문장 속에서 '목적어(선생님을)' 형태로 실현되어 있습니다."}, {"question": "\"어머니, 아버지 저녁 드시러 나가셨습니다.\"라는 문장에서 주격을 나타내는 조사 '께서'가 생략되었으므로 비문법적인 문장이다.", "answer": "X", "explanation": "우리말에서 '조사'는 생략이 가능하므로, '께서'가 생략되더라도 특수 어휘 '드시러'와 선어말 어미 '-시-'를 통해 주체 높임이 정상 실현됩니다."}, {"question": "'편찮으시다'는 그 자체로 높임의 의미를 지닌 특수 어휘이며, 형태소 분석 시 '아프다'에 '-(으)시-'가 결합하여 새로 만들어진 단어는 아니다.", "answer": "O", "explanation": "'편찮으시다'는 '아프다'의 높임말 지위를 갖는 별개의 단독 특수 어휘 형용사입니다."}, {"question": "\"형님이 실력이 계시다.\"는 실력이 형님의 소유이므로 직접 높임 특수 어휘 '계시다'를 자연스럽게 활용한 문장이다.", "answer": "X", "explanation": "'계시다'는 주체를 직접 높일 때만 쓰이므로, 소유물이나 실력 등의 간접 높임에는 '있으시다'를 써야 문법적입니다."}, {"question": "일상 대화에서 친한 친구에게 갑자기 \"아, 그러세요? 그렇게 바쁘시면 어쩔 수 없지요.\"라고 높임 표현을 쓰는 것은 화자의 심리적 거리감이나 불만을 나타내는 의도일 수 있다.", "answer": "O", "explanation": "높임 표현이 지닌 특유의 심리적 거리감을 의도적으로 활용하여 상대방에 대한 불만이나 거절의 감정을 우회적으로 전달할 수 있습니다."}, {"question": "하십시오체 명령형 어미인 \"-으십시오\"는 청자를 아주 높이는 정중한 표현이지만, 대화 상황에 따라 행동을 강요하는 암묵적 강제성을 띨 수 있다.", "answer": "O", "explanation": "\"여기에 앉으십시오\"처럼 행동을 직접 요구하는 형식은 격식은 높으나 완곡하지 않아 상대방에게 암묵적 강제성을 줄 수 있습니다."}, {"question": "\"할아버지, 여기에 앉으시겠어요?\"와 같이 의문 형식을 빌려 청자에게 선택권을 주는 간접 화법은 배려의 태도가 담긴 공손한 표현이다.", "answer": "O", "explanation": "직접적인 명령이나 요청 대신 질문의 형태로 부드럽게 물어보면 상대방에게 선택권을 주어 더욱 공손한 표현이 됩니다."}, {"question": "\"저희가 어머니께 드렸던 선물이 여기 있네요.\"에서 화자 자신이나 화자 측을 낮추는 겸양 어휘는 '저희'이다.", "answer": "O", "explanation": "문장에서 '저희'는 자기를 낮추는 대명사이며, '드리다'는 부사어인 '어머니'를 높이는 객체 높임 특수 어휘에 해당합니다."}, {"question": "'약주'는 '술'을 높여 부르는 명사로, 주체인 윗사람과 관련된 대상을 높이는 간접 높임 어휘에 해당한다.", "answer": "O", "explanation": "'약주'는 높여야 할 인물이 마시는 술을 정중히 높여 부르는 간접 높임 명사가 맞습니다."}, {"question": "'졸고'는 아랫사람이 정성스레 작성한 글이나 원고를 높여 부르는 간접 높임말이다.", "answer": "X", "explanation": "'졸고(원고)'는 화자 자신의 글이나 원고를 청자 앞에서 겸손하게 낮추어 표현하는 간접 낮춤말에 해당합니다."}, {"question": "\"지나야, 가서 할머니 모시고 와.\"에서 '모시고'는 문장의 목적어가 나타내는 대상을 높이기 위한 객체 높임 요소이다.", "answer": "O", "explanation": "목적어인 '할머니'를 높이기 위해 특수 어휘 '데리다' 대신 '모시다'를 적용한 올바른 객체 높임입니다."}, {"question": "\"내일 우리 같이 밥 먹어요.\"라는 문장에는 주체 높임법과 객체 높임법이 모두 누락되어 있고 상대 높임법만 실현되어 있다.", "answer": "O", "explanation": "주어나 목적어/부사어에 대한 높임 요소는 없으며, 종결 부분의 보조사 '요'를 통해 청자를 높이는 상대 높임법(해요체)만 실현되었습니다."}, {"question": "\"이 문제는 아버지께 여쭈어보자.\"에서 객체 높임을 실현하는 문법적 요소는 부사격 조사 '께'와 특수 어휘 '여쭈어보다'이다.", "answer": "O", "explanation": "부사어인 '아버지'를 객체로서 높이기 위해 부사격 조사 '께'와 객체 높임 용언 '여쭈다'를 바르게 조합하여 사용했습니다."}, {"question": "서술어가 형용사일 때는 주체 높임법을 적용할 수 없으므로, \"선생님은 키가 크시다\"는 비문법적인 문장이다.", "answer": "X", "explanation": "서술어가 형용사일 때도 그 상태에 있는 존재가 주체가 되므로, 높임 선어말 어미 '-시-'를 결합하여 주체 높임을 완벽히 실현할 수 있습니다."}, {"question": "\"이 손수건 좀 할아버지께 갖다 드려.\"라는 문장에서는 청자를 높이는 상대 높임법이 정중히 실현되어 있다.", "answer": "X", "explanation": "종결 어미 '-어'(해체)가 쓰여 청자를 낮추고 있으며, '께'와 '드리다'를 통해 객체인 할아버지만 높이고 있습니다."}, {"question": "\"영희가 할머니를 데리고 공원에 갔어요.\"라는 문장은 문법적으로 자연스러운 표현이다.", "answer": "X", "explanation": "서술어의 객체인 목적어 '할머니'가 높임의 대상이므로 '데리고'를 특수 어휘 '모시고'로 고쳐야 올바른 높임 표현이 됩니다."}, {"question": "상대 높임법의 등급 중 '하오체'는 현대 국어에서 사용 빈도가 점차 줄어들고 있으며, 평서형 어미로 '-오'가 주로 사용된다.", "answer": "O", "explanation": "하오체와 하게체는 오늘날 현대 언어생활에서 사용 빈도가 점차 약화되거나 사라지는 경향을 보입니다."}, {"question": "\"선생님께서 나를 부르셨어.\"라는 문장은 주체는 높이고 대화 상대인 청자는 낮추는 복합적인 높임 양상을 띤다.", "answer": "O", "explanation": "주어인 '선생님'은 '께서', '-시-'로 높이고, 대화 상대인 청자는 해체 종결 어미('-어')를 통해 낮추고 있는 복합 문장입니다."}, {"question": "\"문제를 풀다가 어려운 것이 있으면 선생님한테 물어봐.\"라는 문장은 윗사람인 객체를 높이지 않았으므로 \"선생님께 여쭤봐\"로 수정하는 것이 적절하다.", "answer": "O", "explanation": "높임의 대상인 부사어 '선생님'에게 조사 '한테'와 동사 '물어보다'를 쓰는 것은 부적절하므로 객체 높임 형식으로 수정해야 예절에 맞습니다."}, {"question": "\"부장님이 이제 회의실로 온다고 하셨어.\"에서 '온다고'는 부장님의 이동 행동을 높여주지 못했으므로 \"오신다고\"로 고쳐 주체를 직접 높이는 것이 적절하다.", "answer": "O", "explanation": "문장 전체의 서술 주체인 '부장님'의 직접적인 행동을 높이기 위해 선어말 어미 '-시-'를 넣어 \"오신다고\"로 수정해야 문법적으로 적절합니다."}, {"question": "\"연세가 지긋하신 할아버지께서 걸어가신다.\"에서 '연세'는 높여야 할 인물과 관련된 대상을 높이는 명사이며, '께서'와 '-시-'는 주체를 직·간접적으로 높이는 요소이다.", "answer": "O", "explanation": "간접 높임 명사인 '연세'와 주체 직접 높임 요소인 주격 조사 '께서', 선어말 어미 '-시-'가 조화를 이루어 할아버지를 바르게 높이고 있습니다."}, {"question": "상대 높임법에서 '해체'는 격식을 갖추지 않고 친근하게 말하되 청자를 두루 높여 대우하는 비격식체 등급이다.", "answer": "X", "explanation": "'해체'는 비격식체 계열 중에서 청자를 두루 낮추는 이른바 '반말' 등급에 해당합니다."}];
    let selectedQuestions = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let userAnswers = [];

    function shuffle(array) {
        let currentIndex = array.length, randomIndex;
        while (currentIndex !== 0) {
            randomIndex = Math.floor(Math.random() * currentIndex);
            currentIndex--;
            [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
        }
        return array;
    }

    function startQuiz() {
        if (allQuestions.length === 0) {
            alert("문제 데이터를 불러올 수 없습니다.");
            return;
        }
        
        // 랜덤하게 10문제 선택
        let shuffled = shuffle([...allQuestions]);
        selectedQuestions = shuffled.slice(0, 10);
        currentQuestionIndex = 0;
        score = 0;
        userAnswers = [];
        
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.add('hidden');
        document.getElementById('review-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        
        showQuestion();
    }

    function showQuestion() {
        const q = selectedQuestions[currentQuestionIndex];
        document.getElementById('progress').innerText = `문제 ${currentQuestionIndex + 1} / 10`;
        document.getElementById('question-text').innerText = q.question;
    }

    function selectAnswer(answer) {
        const q = selectedQuestions[currentQuestionIndex];
        const isCorrect = (answer === q.answer);
        
        userAnswers.push({
            question: q.question,
            correctAnswer: q.answer,
            userAnswer: answer,
            explanation: q.explanation,
            isCorrect: isCorrect
        });
        
        if (isCorrect) score++;
        
        currentQuestionIndex++;
        if (currentQuestionIndex < selectedQuestions.length) {
            showQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');
        document.getElementById('score-text').innerText = `${score} / 10`;
    }

    function showReview() {
        document.getElementById('result-screen').classList.add('hidden');
        document.getElementById('review-screen').classList.remove('hidden');
        
        const reviewContainer = document.getElementById('review-container');
        reviewContainer.innerHTML = '';
        
        userAnswers.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = `review-item ${item.isCorrect ? 'correct' : ''}`;
            
            const badge = item.isCorrect 
                ? `<span class="badge badge-correct">정답</span>` 
                : `<span class="badge badge-wrong">오답</span>`;
            
            div.innerHTML = `
                <div class="review-q">${index + 1}. ${item.question}</div>
                <div class="review-a">
                    ${badge}
                    나의 선택: <strong>${item.userAnswer}</strong> | 정답: <strong>${item.correctAnswer}</strong>
                </div>
                <div class="review-e"><strong>해설:</strong> ${item.explanation}</div>
            `;
            reviewContainer.appendChild(div);
        });
    }
</script>
